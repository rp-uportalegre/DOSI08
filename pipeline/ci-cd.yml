name: Validar e publicar o portal

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verificar a sintaxe
        run: npm run check
      - name: Executar os testes
        run: npm test
      - name: Construir os ficheiros do site
        run: npm run build
        env:
          VERSAO: ${{ github.sha }}

  publicar-imagem:
    needs: validar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v7
      - name: Identificar a imagem
        id: imagem
        run: echo "nome=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Preparar a construção multi-arquitetura
        uses: docker/setup-qemu-action@v4
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4
      - name: Autenticar no registo
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar
        id: construir
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.imagem.outputs.nome }}:main
            ${{ steps.imagem.outputs.nome }}:sha-${{ github.sha }}
          build-args: VERSAO=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Registar a entrega
        env:
          IMAGEM: ${{ steps.imagem.outputs.nome }}
          DIGEST: ${{ steps.construir.outputs.digest }}
        run: |
          echo "### Imagem entregue ao registo" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagem: `$IMAGEM:main`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: `$DIGEST`" >> "$GITHUB_STEP_SUMMARY"
          echo "Confirme o deploy nos registos e no HTTP da VM Alpine." >> "$GITHUB_STEP_SUMMARY"
