<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos da turma</title>
  <link rel="stylesheet" href="estilos.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><p>DOSI · Laboratório de CI/CD</p><h1>Projetos da turma</h1>
    <p id="apresentacao">Um espaço para descobrir o trabalho da turma. Terceira Versão</p></header>
  <main>
    <label for="pesquisa">Pesquisar por título ou Categoria</label>
    <input id="pesquisa" type="search" placeholder="Por exemplo, agenda ou web">
    <p id="total" aria-live="polite"></p>
    <section id="projetos" aria-label="Projetos disponíveis"></section>
    <p id="vazio" hidden>Não foram encontrados projetos.</p>
  </main>
  <footer><p id="versao">Versão de desenvolvimento</p></footer>
</body>
</html>
